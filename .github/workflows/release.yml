name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Build
        shell: pwsh
        run: |
          dotnet publish src/SimpleReplay/SimpleReplay.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -p:PublishSingleFile=true `
            -o publish

      - name: Download previous release (for delta packages)
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --outputDir releases `
            --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # no-op on first release

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId SimpleReplay `
            --packVersion "1.0.${{ github.run_number }}" `
            --packDir publish `
            --mainExe SimpleReplay.exe `
            --packTitle "Simple Replay" `
            --framework net8.0-x64-desktop `
            --outputDir releases

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Simple Replay v1.0.${{ github.run_number }}"
          generate_release_notes: true
          files: releases/*
